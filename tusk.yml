tasks:
  rez:
    description: "Rez - Right side only keyboard, 4 rows x 5 columns"
    options:
      keybind:
        default: simple
        short: b
        usage: Type of keybinds
      flash:
        default: false
        short: f
        type: bool
        usage: Flash the keyboard after compiling
    run: |
      if [ "${flash}" = "true" ]; then
        qmk flash -kb rez -km ${keybind}
      else
        qmk compile -kb rez -km ${keybind}
      fi
  gez:
    description: "Gez V1 - Enhanced split ergonomic keyboard with 6-column layout"
    options:
      keybind:
        default: default
        short: b
        usage: Type of keybinds
      flash:
        default: false
        short: f
        type: bool
        usage: Flash the keyboard after compiling
      side:
        default: left
        short: s
        usage: Which side to flash (left/right)
        values:
          - left
          - right
    run: |
      if [ "${flash}" = "true" ]; then
        if [ "${side}" = "right" ]; then
          qmk flash -kb gez -km ${keybind} -bl avrdude-split-right
        else
          qmk flash -kb gez -km ${keybind} -bl avrdude-split-left
        fi
      else
        qmk compile -kb gez -km ${keybind}
      fi
  tez:
    description: "Tez - 34-key split ergonomic keyboard with column stagger and thumb clusters"
    options:
      keybind:
        default: default
        short: b
        usage: Type of keybinds
      flash:
        default: false
        short: f
        type: bool
        usage: Flash the keyboard after compiling
      side:
        default: left
        short: s
        usage: Which side to flash (left/right)
        values:
          - left
          - right
    run: |
      if [ "${flash}" = "true" ]; then
        if [ "${side}" = "right" ]; then
          qmk flash -kb tez -km ${keybind} -bl avrdude-split-right
        else
          qmk flash -kb tez -km ${keybind} -bl avrdude-split-left
        fi
      else
        qmk compile -kb tez -km ${keybind}
      fi
  ergodox:
    description: "Ergodox EZ - Split ergonomic keyboard with thumb clusters (uses HalfKay bootloader)"
    options:
      keybind:
        default: yoni
        short: b
        usage: Type of keybinds
      flash:
        default: false
        short: f
        type: bool
        usage: Flash the keyboard after compiling
    run: |
      if [ "${flash}" = "true" ]; then
        qmk flash -kb ergodox_ez -km ${keybind}
      else
        qmk compile -kb ergodox_ez -km ${keybind}
      fi
  install:
    description: "Install dependencies needed for flashing keyboards (teensy-loader-cli, udev rules)"
    run: |
      echo "Installing teensy-loader-cli..."
      if command -v apt-get >/dev/null 2>&1; then
        sudo apt-get install -y teensy-loader-cli libusb-dev
      else
        echo "apt-get not found, building teensy-loader-cli from source..."
        sudo apt-get install -y libusb-dev || true
        git clone https://github.com/PaulStoffregen/teensy_loader_cli /tmp/teensy_loader_cli
        make -C /tmp/teensy_loader_cli
        sudo cp /tmp/teensy_loader_cli/teensy_loader_cli /usr/local/bin/teensy-loader-cli
        rm -rf /tmp/teensy_loader_cli
      fi
      echo "Installing QMK udev rules..."
      sudo cp util/udev/50-qmk.rules /etc/udev/rules.d/
      sudo udevadm control --reload-rules && sudo udevadm trigger
      echo "Done! You may need to re-plug your keyboard."
  planck:
    description: "Planck - 48-key ortholinear keyboard (4x12 grid layout), non-split, compact form factor"
    options:
      keymap:
        default: yoni
        short: k
        usage: Type of keymap
      flash:
        default: false
        short: f
        type: bool
        usage: Flash the keyboard after compiling
    run: |
      if [ "${flash}" = "true" ]; then
        qmk flash --keyboard planck/rev6 -km ${keymap}
      else
        qmk compile --keyboard planck/rev6 -km ${keymap}
      fi
